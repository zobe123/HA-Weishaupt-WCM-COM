name: Create release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract release notes
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          awk -v version="$RELEASE_VERSION" '
            $0 == "## [" version "]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No CHANGELOG.md section found for $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Build HACS release archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path("custom_components/weishaupt_wcm_com")
          output = Path("weishaupt_wcm_com.zip")

          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for path in sorted(source.rglob("*")):
                  if (
                      path.is_file()
                      and "__pycache__" not in path.parts
                      and path.suffix != ".pyc"
                  ):
                      archive.write(path, path.relative_to(source))
          PY

          unzip -t weishaupt_wcm_com.zip
          unzip -p weishaupt_wcm_com.zip manifest.json > packaged-manifest.json
          cmp custom_components/weishaupt_wcm_com/manifest.json packaged-manifest.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_args=()
          if [[ "$GITHUB_REF_NAME" =~ [A-Za-z] ]]; then
            prerelease_args+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Version $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            weishaupt_wcm_com.zip \
            "${prerelease_args[@]}"
